<!DOCTYPE html>
<html>
<head>
  <title>Our Memory 💖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: url('bg.jpeg') no-repeat center/cover;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 30px;
      text-shadow: 0 0 10px lightgreen;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 20px;
      justify-content: center;
      margin-top: 50px;
    }

    .card {
      width: 100px;
      height: 120px;
      background: #1f7a5c;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 30px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.1);
    }

    .card.open {
      background: #fff;
      color: black;
    }

    /* popup */
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .popup img {
      width: 200px;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background: hotpink;
      color: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Find Our Special Memory 💚</h1>

<div class="grid">
  <div class="card" onclick="openCard(this,0)">💚</div>
  <div class="card" onclick="openCard(this,1)">💚</div>
  <div class="card" onclick="openCard(this,2)">💚</div>
  <div class="card" onclick="openCard(this,3)">💚</div>
  <div class="card" onclick="openCard(this,4)">💚</div>
  <div class="card" onclick="openCard(this,5)">💚</div>
</div>

<!-- popup -->
<div class="popup" id="popup">
  <img id="popup-img">
  <p id="popup-text"></p>
  <button onclick="closePopup()">Next 💖</button>
</div>

<script>
let opened = [];

// which cards are correct (3 cards)
let correctCards = [1, 3, 5];

// images + messages
let images = ["pic1.jpeg", "pic2.jpeg", "pic3.jpeg"];
let messages = [
  "💖 Our first memory together 😍",
  "💖 This day was so special 💫",
  "💖 My most favourite picture ❤️"
];

let current = 0;

function openCard(card, index) {
  if (!card.classList.contains("open")) {
    card.classList.add("open");
    card.innerHTML = "😍";
  }

  if (correctCards.includes(index)) {
    if (!opened.includes(index)) {
      opened.push(index);

      document.getElementById("popup-img").src = images[current];
      document.getElementById("popup-text").innerText = messages[current];
      document.getElementById("popup").style.display = "block";

      current++;
    }
  }
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
