<!DOCTYPE html>
<html>
<head>
  <title>Will You Remember Me? 💖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;

      background: url('bg4.jpeg') no-repeat center center;
      background-size: cover;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin-top: 40px;
      color: white;
      font-size: 36px;
      text-align: center;
      text-shadow: 2px 2px 5px black;
    }

    .buttons {
      margin-bottom: 60px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .yes {
      background: pink;
    }

    .no {
      background: lightgray;
    }

    /* POPUP */
    .popup-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: black;
      color: white;
      padding: 30px;
      border-radius: 15px;
      font-size: 22px;
      text-align: center;
      transition: 0.3s;
    }

    .show {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

<body>

<h1>Will you remember me ? always 🙂</h1>

<div class="buttons">
  <button class="yes" onclick="goNext()">Yes I Do 💖</button>
  <button class="no" onclick="showMessages()">No, I won't 💔</button>
</div>

<!-- POPUPS -->
<div id="msg1" class="popup-msg">Dont forgot me 🥲🫠</div>
<div id="msg2" class="popup-msg">My bond is so special 💖</div>
<div id="msg3" class="popup-msg">Say i do 😁❤️</div>

<script>
function showMessages() {
  let m1 = document.getElementById("msg1");
  let m2 = document.getElementById("msg2");
  let m3 = document.getElementById("msg3");

  m1.classList.add("show");

  setTimeout(() => {
    m1.classList.remove("show");
    m2.classList.add("show");
  }, 1500);

  setTimeout(() => {
    m2.classList.remove("show");
    m3.classList.add("show");
  }, 3000);

  setTimeout(() => {
    m3.classList.remove("show");
  }, 4500);
}

function goNext(){
  window.location.href = "page5.html";
}
</script>

</body>
</html>
