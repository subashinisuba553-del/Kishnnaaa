<!DOCTYPE html>
<html>
<head>
  <title>Final Surprise 🎬💖</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: red;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px red, 0 0 30px red;
    }

    .overlay-text {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      text-shadow: 2px 2px 10px black;
      display: none;
    }
  </style>
</head>

<body>

<!-- VIDEO -->
<video id="video" controls>
  <source src="video2.mp4" type="video/mp4">
</video>

<!-- PLAY BUTTON -->
<button class="play-btn" onclick="startVideo()">Play Surprise 🎬💖</button>

<div class="overlay-text" id="text">For you 💖 Always...</div>

<script>
function startVideo(){
  let vid = document.getElementById("video");
  vid.play(); // plays with audio
  document.querySelector(".play-btn").style.display = "none";
  document.getElementById("text").style.display = "block";
}
</script>

</body>
</html>
