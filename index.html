<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
    }

    .bg {
      background: url('photo1.jpeg') no-repeat center center/cover;
      height: 100%;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: white;
      font-size: 60px;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 0 20px yellow;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff4da6; }
      to { text-shadow: 0 0 30px #ff99cc; }
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      background: pink;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: hotpink;
      transform: scale(1.1);
      <audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
    }

  </style>
</head>

<body>

  <div class="bg">
    <div class="overlay">
      
      <h1>Happie Birthday Kishnaaaaaaa ❤️</h1>

      <button class="btn" onclick="nextPage()">Let's Start </button>

    </div>
  </div>

  <script>
    function nextPage() {
      window.location.href = "page2.html";
    }
  </script>

</body>
</html>
