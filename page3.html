<!DOCTYPE html>
<html>
<head>
  <title>Find the Special Cards 💖</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: -1;
    }

    h1 {
      color: white;
      text-shadow: 0 0 10px pink;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      gap: 20px;
      justify-content: center;
      margin-top: 50px;
    }

    .card {
      width: 120px;
      height: 120px;
      background: pink;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 15px;
      font-size: 18px;
      overflow: hidden;
      transition: 0.5s;
    }

    .card:hover {
      transform: scale(1.1);
    }

    .card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .msg {
      font-size: 12px;
      color: white;
      margin-top: 5px;
    }

    #continueBtn {
      display: none;
      margin-top: 40px;
      background: hotpink;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px pink; }
      to { box-shadow: 0 0 20px red; }
    }
  </style>

</head>

<body>

<h1>Find 3 Special Cards 💌</h1>

<div class="container">

  <div class="card" onclick="openCard(this, false)">💌</div>

  <div class="card" onclick="openCard(this, true, 'pic1.jpg', 'My Love 💖')">💌</div>

  <div class="card" onclick="openCard(this, false)">💌</div>

  <div class="card" onclick="openCard(this, true, 'pic2.jpg', 'My Happiness 😍')">💌</div>

  <div class="card" onclick="openCard(this, false)">💌</div>

  <div class="card" onclick="openCard(this, true, 'pic3.jpg', 'Forever Us 💍')">💌</div>

</div>

<button id="continueBtn" onclick="goNextPage()">Continue 💖</button>

<script>

let found = 0;
let totalSpecial = 3;

function openCard(card, isSpecial, img = "", msg = "") {

  if (card.classList.contains("opened")) return;

  card.classList.add("opened");

  if (isSpecial) {
    card.innerHTML = `
      <div>
        <img src="${img}">
        <div class="msg">${msg}</div>
      </div>
    `;

    found++;

    if (found === totalSpecial) {
      document.getElementById("continueBtn").style.display = "block";
    }

  } else {
    card.innerHTML = "Try again 😅";
  }
}

function goNextPage() {
  window.location.href = "page4.html";
}

</script>

</body>
</html>
