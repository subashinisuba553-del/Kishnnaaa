<!DOCTYPE html>
<html>
<head>
  <title>Find the Special Cards 💖</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: url('bg.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      top: 0;
      left: 0;
      z-index: -1;
    }

    h1 {
      color: white;
      text-shadow: 0 0 10px pink;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 25px;
      justify-content: center;
      margin-top: 50px;
    }

    .card {
      width: 180px;
      height: 180px;
      background: pink;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 20px;
      font-size: 22px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.1);
    }

    /* FULL SCREEN POPUP */
    .popup {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
    }

    .popup img {
      width: 200px;
      border-radius: 15px;
    }

    .popup p {
      color: white;
      font-size: 20px;
      margin-top: 15px;
    }

    .closeBtn {
      margin-top: 15px;
      padding: 8px 20px;
      background: hotpink;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }

    #continueBtn {
      display: none;
      margin-top: 30px;
      background: hotpink;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px pink; }
      to { box-shadow: 0 0 20px red; }
    }
  </style>
</head>

<body>

<h1>Find 3 Special Cards 💌</h1>

<div class="container">
  <div class="card" onclick="openCard(false)">💌</div>
  <div class="card" onclick="openCard(true, 'pic1.jpeg', 'My Love 💖')">💌</div>
  <div class="card" onclick="openCard(false)">💌</div>
  <div class="card" onclick="openCard(true, 'pic2.jpeg', 'My Happiness 😍')">💌</div>
  <div class="card" onclick="openCard(false)">💌</div>
  <div class="card" onclick="openCard(true, 'pic3.jpeg', 'Forever Us 💍')">💌</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <img id="popupImg">
  <p id="popupMsg"></p>
  <button class="closeBtn" onclick="closePopup()">Close 💖</button>
</div>

<button id="continueBtn" onclick="goNextPage()">Continue 💖</button>

<script>

let found = 0;
let totalSpecial = 3;

function openCard(isSpecial, img = "", msg = "") {

  if (isSpecial) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupImg").src = img;
    document.getElementById("popupMsg").innerText = msg;

    found++;

    if (found === totalSpecial) {
      document.getElementById("continueBtn").style.display = "block";
    }

  } else {
    alert("Try again 😅");
  }
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function goNextPage() {
  window.location.href = "page4.html";
}

</script>

</body>
</html>
