<!DOCTYPE html>
<html>
<head>
  <title>Memories 💖</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: url('bg.jpeg') no-repeat center center/cover;
    }

    h1 {
      text-align: center;
      color: white;
      margin-top: 20px;
      text-shadow: 2px 2px 5px black;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px;
    }

    .card {
      height: 180px;
      background: rgba(255,255,255,0.2);
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    /* OPEN CARD FULL SCREEN */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: green;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .popup img {
      width: 250px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .popup p {
      font-size: 20px;
      white-space: pre-line;
    }

    .closeBtn {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: green;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .continueBtn {
      display: block;
      margin: 20px auto;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: pink;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Our Memories 💖</h1>

<div class="container">

  <div class="card" onclick="openCard(1)">Card 1</div>
  <div class="card" onclick="openCard(2)">Card 2</div>
  <div class="card" onclick="openCard(3)">Card 3</div>

  <div class="card">💖</div>
  <div class="card">💖</div>
  <div class="card">💖</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <img id="cardImg" src="">
  <p id="cardText"></p>
  <button class="closeBtn" onclick="closeCard()">Close</button>
</div>

<button class="continueBtn" onclick="goNext()">Continue 💖</button>

<script>
function openCard(num) {
  let img = document.getElementById("cardImg");
  let text = document.getElementById("cardText");

  if(num == 1){
    img.src = "pic1.jpeg";
    text.innerText = `I dont have 1st meet pic
So 2nd meet pic 😝`;
  }

  if(num == 2){
    img.src = "pic2.jpeg";
    text.innerText = `scoldings ,bond, fights,
good time, tears, movie,
bike ride all in one day`;
  }

  if(num == 3){
    img.src = "pic3.jpeg";
    text.innerText = `Surprise meet
Fav one 🤗❤️‍🩹`;
  }

  document.getElementById("popup").style.display = "flex";
}

function closeCard(){
  document.getElementById("popup").style.display = "none";
}

function goNext(){
  window.location.href = "page4.html";
}
</script>

</body>
</html>
